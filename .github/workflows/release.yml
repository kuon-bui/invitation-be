name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  # Never cancel main runs: a cancelled run could leave a release tag without its image
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Tags pushed by release-please with GITHUB_TOKEN don't trigger workflows, so the image is built here
  docker:
    needs: release-please
    # main: build + push only when release-please created a release; PRs: build only to validate the Dockerfile
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fallback keeps PR builds working without Docker Hub secrets (e.g. forks)
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/invitation-backend
      VERSION: ${{ needs.release-please.outputs.version }}
      PUSH: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # flavor latest=auto (default) also tags stable semver releases as `latest`
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.PUSH }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
